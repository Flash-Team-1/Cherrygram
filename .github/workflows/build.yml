name: Android Build

on:
  push:
    branches: [ "main_Reproducible_Builds" ]
  pull_request:
    branches: [ "main_Reproducible_Builds" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 1

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install required NDK and CMake
      run: |
        echo "y" | sdkmanager "ndk;27.2.12479018"
        echo "y" | sdkmanager "cmake;3.22.1"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create dummy keystore
      run: |
        mkdir -p TMessagesProj/config
        rm -f TMessagesProj/config/release.keystore
        keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
          -alias androidkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Cherrygram, OU=Development, O=Cherrygram, L=Unknown, ST=Unknown, C=US" \
          -noprompt

    - name: Update gradle.properties
      run: |
        sed -i 's/RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=android/' gradle.properties
        sed -i 's/RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=android/' gradle.properties
        sed -i 's/RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=androidkey/' gradle.properties

    - name: Update Cherrygram Extra.kt with API credentials
      run: |
        # Update the Extra.kt file with your API ID and HASH
        # Path based on README: TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt
        if [ -f TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt ]; then
          sed -i 's/const val APP_ID = .*/const val APP_ID = 26333172/' TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt
          sed -i 's/const val APP_HASH = .*/const val APP_HASH = "2a031a551da8ca175b0225eac8a2a131"/' TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt
        else
          echo "Extra.kt not found, checking for other config files..."
          # Fallback: try to find the file
          find . -name "Extra.kt" -type f
        fi

    - name: Build with Gradle and capture errors
      env:
        RELEASE_STORE_PASSWORD: android
        RELEASE_KEY_PASSWORD: android
        RELEASE_KEY_ALIAS: androidkey
      run: |
        echo "=== Starting Build ==="
        # Build the standalone version (adjust if you need a different variant)
        # The README mentions modules: TMessagesProj_App, TMessagesProj_AppHuawei, TMessagesProj_AppStandalone
        ./gradlew :TMessagesProj_AppStandalone:assembleRelease --stacktrace --info --no-daemon 2>&1 | tee build.log
        # Check if build failed
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "=== BUILD FAILED ==="
          echo "=== Extracting error message ==="
          grep -A 20 "What went wrong" build.log || true
          grep -A 10 "FAILURE" build.log || true
          grep -B 5 -A 10 "Exception" build.log | head -50 || true
          exit 1
        fi

    - name: Find APK files
      if: success()
      run: |
        echo "Searching for APK files..."
        find . -name "*.apk" -type f
        echo "=== APK locations with size ==="
        find . -name "*.apk" -type f -exec ls -lh {} \;

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: cherrygram-apk
        path: |
          TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          TMessagesProj_App/build/outputs/apk/**/*.apk
          TMessagesProj_AppHuawei/build/outputs/apk/**/*.apk
          **/build/outputs/apk/**/*.apk

    - name: Upload build logs (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build.log
